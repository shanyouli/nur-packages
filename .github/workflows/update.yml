name: Update src and lock

on:
  push:
    branches:
      - master
    paths:
      - 'nvfetcher.toml'
      - 'pkgs/**/update.py'
  schedule:
    # run this daily at 8am UTC, or roughly 4am eastern
    - cron: '15 21 * * 5'
  workflow_dispatch:
    inputs:
      lock:
        description: '更新 flake.lock（nix flake update）'
        type: boolean
        default: true
      nvfetcher:
        description: 'nvfetcher 更新 _sources 源码'
        type: boolean
        default: true
      updatepy:
        description: 'updatePy 脚本更新 pkgs sources.json'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-src-and-lock
  cancel-in-progress: false

# 合并自原 upnvfetcher.yml / uppython.yml / update.yml（沿用 update.yml 文件名）：
#   push 只改 nvfetcher.toml            -> 仅跑 nvfetcher（对应原 upnvfetcher.yml）
#   push 只改 pkgs/**/update.py         -> 仅跑 updatePy（对应原 uppython.yml）
#   schedule                            -> 全量 lock + nvfetcher + updatePy（对应原 update.yml）
#   workflow_dispatch                   -> 按手动勾选决定，默认全量（不勾选任何项则仅跑 pre-work 后跳过）
# 更新统一推送到 flakebot 分支并创建/复用 flakebot -> master 的 PR，
# 最后只 dispatch 一次 build.yml（trigger-second-workflow）。
jobs:
  pre-work:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      runNvfetcher: ${{ steps.decide.outputs.runNvfetcher }}
      runUpdatePy: ${{ steps.decide.outputs.runUpdatePy }}
      runLock: ${{ steps.decide.outputs.runLock }}
      prTitle: ${{ steps.decide.outputs.prTitle }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - name: Decide what to update
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_LOCK: ${{ inputs.lock }}
          INPUT_NVFETCHER: ${{ inputs.nvfetcher }}
          INPUT_UPDATEPY: ${{ inputs.updatepy }}
        run: |
          runNvfetcher=false
          runUpdatePy=false
          runLock=false

          if [ "$EVENT_NAME" = "push" ]; then
            # diff 基线：优先用 push 事件的 before；force push 后 before 可能不在
            # 历史中，回退到上一个 commit；仍不可用（如首个 push）则退化为全量更新
            before="$BEFORE_SHA"
            if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
              before="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi

            if [ -z "$before" ]; then
              runNvfetcher=true
              runUpdatePy=true
              runLock=true
            else
              changed="$(git diff --name-only "$before" "${{ github.sha }}")"

              if echo "$changed" | grep -q '^nvfetcher\.toml$'; then
                # 本次 push 已包含 _sources/ 产物更新，说明 nvfetcher 已被手动执行过，跳过
                if ! echo "$changed" | grep -q '^_sources/'; then
                  runNvfetcher=true
                fi
              fi

              # update.py 变化时直接重跑；updatePy 幂等，重复执行无副作用
              # （修正原 uppython.yml 检测脚本自身导致主任务被跳过的问题）
              if echo "$changed" | grep -q 'update\.py$'; then
                runUpdatePy=true
              fi
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 手动触发：按界面勾选决定（boolean input 在 env 中渲染为 true/false 字符串）
            runLock="$INPUT_LOCK"
            runNvfetcher="$INPUT_NVFETCHER"
            runUpdatePy="$INPUT_UPDATEPY"
          else
            # schedule：全量更新
            runNvfetcher=true
            runUpdatePy=true
            runLock=true
          fi

          if [ "$runLock" = "true" ]; then
            prTitle='Update src and lock'
          elif [ "$runNvfetcher" = "true" ] && [ "$runUpdatePy" = "true" ]; then
            prTitle='Update src by nvfetcher and python script'
          elif [ "$runNvfetcher" = "true" ]; then
            prTitle='Update src by nvfetcher'
          else
            prTitle='Update src by python script'
          fi

          echo "runNvfetcher=$runNvfetcher" >> "$GITHUB_OUTPUT"
          echo "runUpdatePy=$runUpdatePy" >> "$GITHUB_OUTPUT"
          echo "runLock=$runLock" >> "$GITHUB_OUTPUT"
          echo "prTitle=$prTitle" >> "$GITHUB_OUTPUT"

  update:
    needs: pre-work
    if: needs.pre-work.outputs.runNvfetcher == 'true' || needs.pre-work.outputs.runUpdatePy == 'true' || needs.pre-work.outputs.runLock == 'true'
    runs-on: ubuntu-latest
    steps:
      # - uses: styfle/cancel-workflow-action@0.7.0
      #   with:
      #     access_token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - uses: cachix/install-nix-action@v31
        with:
          # FIXME: https://github.com/NixOS/nix/issues/9889
          extra_nix_config: |
            experimental-features = nix-command flakes configurable-impure-env auto-allocate-uids
      - name: Prepare flakebot branch
        run: |
          git config --local user.email "flakebot@users.noreply.github.com"
          git config --local user.name "flakebot"
          git checkout -B flakebot
      - name: Backup before auto-update to another branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: flakebot
          force: true
      - name: Update and commit lockfile
        if: needs.pre-work.outputs.runLock == 'true'
        run: nix flake update --commit-lock-file
      - name: Update nvfetcher src
        if: needs.pre-work.outputs.runNvfetcher == 'true'
        run: |
          cat > secrets.toml <<EOF
          [keys]
          github = "${{ secrets.GITHUB_TOKEN }}"
          EOF
          nix run .#nvfetcher
          rm -f secrets.toml
      - name: Update src by python script
        if: needs.pre-work.outputs.runUpdatePy == 'true'
        run: nix run .#updatePy
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: flakebot
          force: true
      # gh CLI 版 PR 创建（自 upnvfetcher.yml 迁移）：vsoch/pull-request-action 的
      # "check if PR exists" 请求不带 auth headers，会撞上匿名 60 req/hour 的
      # API 限流。gh 的所有请求均已认证。
      # PR body 由 tools/pr_body.py 基于 master...flakebot 实际差异生成；
      # 已存在打开的 flakebot -> master PR 时不再跳过，而是用 gh pr edit
      # 同步刷新 title/body，保证 body 每次运行都反映最新更新内容。
      - name: Generate PR body
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_LOCK: ${{ needs.pre-work.outputs.runLock }}
          RUN_NVFETCHER: ${{ needs.pre-work.outputs.runNvfetcher }}
          RUN_UPDATEPY: ${{ needs.pre-work.outputs.runUpdatePy }}
        run: python3 tools/pr_body.py
      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # reuse the existing token, no extra secret needed
          PR_TITLE: ${{ needs.pre-work.outputs.prTitle }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          # body 生成步骤意外失败时兜底，避免空 body
          [ -s "$PR_BODY_FILE" ] || printf 'This is an automated pull request to update src and lock.\n' > "$PR_BODY_FILE"
          pr_num=$(gh pr list --repo "$GITHUB_REPOSITORY" --head flakebot --base master --state open --limit 100 --json number --jq '.[0].number // empty')
          if [ -n "$pr_num" ]; then
            echo "Pull request from flakebot to master is already open (#$pr_num), syncing title/body."
            gh pr edit "$pr_num" --repo "$GITHUB_REPOSITORY" --title "$PR_TITLE" --body-file "$PR_BODY_FILE"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head flakebot \
              --title "$PR_TITLE" \
              --body-file "$PR_BODY_FILE" \
              --no-maintainer-edit # 原 --maintainer-can-modify=false 并非 gh CLI 的有效 flag
          fi
      - name: Trigger build workflow
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "trigger-second-workflow"}'
