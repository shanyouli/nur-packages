name: Update src and lock

on:
  push:
    branches:
      - master
    paths:
      - 'nvfetcher.toml'
      - 'pkgs/**/update.py'
  schedule:
    # UTC 18:00 周五 = 北京时间（UTC+8）周六 02:00
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      lock:
        description: '更新 flake.lock（nix flake update）'
        type: boolean
        default: true
      nvfetcher:
        description: 'nvfetcher 更新 _sources 源码'
        type: boolean
        default: true
      updatepy:
        description: 'updatePy 脚本更新 pkgs sources.json'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-src-and-lock
  cancel-in-progress: false

# 合并自原 upnvfetcher.yml / uppython.yml / update.yml（沿用 update.yml 文件名）：
#   push 只改 nvfetcher.toml            -> 仅跑 nvfetcher（对应原 upnvfetcher.yml）
#   push 只改 pkgs/**/update.py         -> 仅跑 updatePy（对应原 uppython.yml）
#   schedule                            -> 全量 lock + nvfetcher + updatePy（对应原 update.yml）
#   workflow_dispatch                   -> 按手动勾选决定，默认全量（不勾选任何项则仅跑 pre-work 后跳过）
# 更新统一推送到 flakebot 分支并创建/复用 flakebot -> master 的 PR，
# 最后只 dispatch 一次 build.yml（trigger-second-workflow）。
#
# ⚠️ token 使用规则（2026-06 GitHub 行为变更，见官方 changelog
#   "Bot-created pull requests can run workflows if approved"）：
#   自该变更起，GITHUB_TOKEN（github-actions[bot]）创建的 PR 会触发 on: pull_request
#   工作流，但运行被置于 action_required 待审批状态，无人审批即过期报错
#   "This workflow run required approval but was not approved before it expired"。
#   因此创建/编辑 flakebot PR 及推送 flakebot 分支必须使用 PAT（可信身份，
#   AUTOMERGE_TOKEN）：PR 作者为有写权限的用户后，PR 触发的运行免审批直接执行，
#   devpkgs.yml / build.yml 内的 flakebot PR 跳过守卫才能生效（跳过而非报错）。
#   repository_dispatch 触发 build.yml 属 GITHUB_TOKEN 的官方豁免事件，仍用
#   GITHUB_TOKEN；nvfetcher 的 GitHub API 限流 token 亦无需更换。
jobs:
  pre-work:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      runNvfetcher: ${{ steps.decide.outputs.runNvfetcher }}
      runUpdatePy: ${{ steps.decide.outputs.runUpdatePy }}
      runLock: ${{ steps.decide.outputs.runLock }}
      prTitle: ${{ steps.decide.outputs.prTitle }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - name: Decide what to update
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_LOCK: ${{ inputs.lock }}
          INPUT_NVFETCHER: ${{ inputs.nvfetcher }}
          INPUT_UPDATEPY: ${{ inputs.updatepy }}
        run: |
          runNvfetcher=false
          runUpdatePy=false
          runLock=false

          if [ "$EVENT_NAME" = "push" ]; then
            # diff 基线：优先用 push 事件的 before；force push 后 before 可能不在
            # 历史中，回退到上一个 commit；仍不可用（如首个 push）则退化为全量更新
            before="$BEFORE_SHA"
            if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
              before="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi

            if [ -z "$before" ]; then
              runNvfetcher=true
              runUpdatePy=true
              runLock=true
            else
              changed="$(git diff --name-only "$before" "${{ github.sha }}")"

              if echo "$changed" | grep -q '^nvfetcher\.toml$'; then
                # 本次 push 已包含 _sources/ 产物更新，说明 nvfetcher 已被手动执行过，跳过
                if ! echo "$changed" | grep -q '^_sources/'; then
                  runNvfetcher=true
                fi
              fi

              # update.py 变化时直接重跑；updatePy 幂等，重复执行无副作用
              # （修正原 uppython.yml 检测脚本自身导致主任务被跳过的问题）
              if echo "$changed" | grep -q 'update\.py$'; then
                runUpdatePy=true
              fi
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 手动触发：按界面勾选决定（boolean input 在 env 中渲染为 true/false 字符串）
            runLock="$INPUT_LOCK"
            runNvfetcher="$INPUT_NVFETCHER"
            runUpdatePy="$INPUT_UPDATEPY"
          else
            # schedule：全量更新
            runNvfetcher=true
            runUpdatePy=true
            runLock=true
          fi

          if [ "$runLock" = "true" ]; then
            prTitle='Update src and lock'
          elif [ "$runNvfetcher" = "true" ] && [ "$runUpdatePy" = "true" ]; then
            prTitle='Update src by nvfetcher and python script'
          elif [ "$runNvfetcher" = "true" ]; then
            prTitle='Update src by nvfetcher'
          else
            prTitle='Update src by python script'
          fi

          echo "runNvfetcher=$runNvfetcher" >> "$GITHUB_OUTPUT"
          echo "runUpdatePy=$runUpdatePy" >> "$GITHUB_OUTPUT"
          echo "runLock=$runLock" >> "$GITHUB_OUTPUT"
          echo "prTitle=$prTitle" >> "$GITHUB_OUTPUT"

  update:
    needs: pre-work
    if: needs.pre-work.outputs.runNvfetcher == 'true' || needs.pre-work.outputs.runUpdatePy == 'true' || needs.pre-work.outputs.runLock == 'true'
    runs-on: ubuntu-latest
    steps:
      # - uses: styfle/cancel-workflow-action@0.7.0
      #   with:
      #     access_token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      # GitHub 偶发在 push 时返回 5xx（remote: Internal Server Error，带 Request ID），
      # 属服务端瞬时故障。ad-m/github-push-action 内部只执行一次裸 git push，
      # 不会重试，单次 5xx 就会让整个 job 失败；故改用带指数退避重试的脚本。
      - name: Prepare push helper
        run: |
          cat > "$RUNNER_TEMP/push-retry.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          # 强制推送 HEAD 到指定分支，失败时按指数退避重试。
          # 用法: push-retry.sh <目标分支>
          set -euo pipefail

          if [[ $# -lt 1 ]]; then
            echo "用法: push-retry.sh <目标分支>" >&2
            exit 1
          fi

          dest="$1"
          max_attempts="${PUSH_MAX_ATTEMPTS:-5}"

          : "${GITHUB_TOKEN:?需要 GITHUB_TOKEN 环境变量}"
          : "${GITHUB_REPOSITORY:?需要 GITHUB_REPOSITORY 环境变量}"

          # 显式携带 token，不依赖 actions/checkout 的 persist-credentials
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for (( attempt = 1; attempt <= max_attempts; attempt++ )); do
            echo "第 ${attempt}/${max_attempts} 次尝试推送 HEAD -> ${dest} ..."
            if git push --force "$url" "HEAD:refs/heads/${dest}"; then
              echo "推送成功: ${dest}"
              exit 0
            fi
            if (( attempt < max_attempts )); then
              delay=$(( attempt * 10 ))
              echo "推送失败，${delay} 秒后重试 ..."
              sleep "$delay"
            fi
          done

          echo "连续 ${max_attempts} 次推送 ${dest} 均失败，放弃。" >&2
          exit 1
          SCRIPT
          chmod +x "$RUNNER_TEMP/push-retry.sh"
      - uses: cachix/install-nix-action@v31
        with:
          # FIXME: https://github.com/NixOS/nix/issues/9889
          extra_nix_config: |
            experimental-features = nix-command flakes configurable-impure-env auto-allocate-uids
      - name: Prepare flakebot branch
        run: |
          git config --local user.email "flakebot@users.noreply.github.com"
          git config --local user.name "flakebot"
          git checkout -B flakebot
      - name: Backup before auto-update to another branch
        env:
          # 必须用 PAT（可信身份）而非 GITHUB_TOKEN：此推送会让已存在的 flakebot PR
          # 产生 synchronize 事件，bot 身份触发的 pull_request 运行会被置于待审批
          # 状态并最终过期报错（PAT 则免审批）。push-retry.sh 读取的 env 名固定为
          # GITHUB_TOKEN，这里只是换填 token 值。
          GITHUB_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: bash "$RUNNER_TEMP/push-retry.sh" flakebot
      - name: Update and commit lockfile
        if: needs.pre-work.outputs.runLock == 'true'
        run: nix flake update --commit-lock-file
      - name: Update nvfetcher src
        if: needs.pre-work.outputs.runNvfetcher == 'true'
        run: |
          cat > secrets.toml <<EOF
          [keys]
          github = "${{ secrets.GITHUB_TOKEN }}"
          EOF
          nix run .#nvfetcher
          rm -f secrets.toml
      - name: Update src by python script
        if: needs.pre-work.outputs.runUpdatePy == 'true'
        run: nix run .#updatePy
      - name: Push changes
        env:
          # 同上：PAT 触发的 flakebot PR synchronize 运行免审批（见文件头说明）。
          GITHUB_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: bash "$RUNNER_TEMP/push-retry.sh" flakebot
      # gh CLI 版 PR 创建（自 upnvfetcher.yml 迁移）：vsoch/pull-request-action 的
      # "check if PR exists" 请求不带 auth headers，会撞上匿名 60 req/hour 的
      # API 限流。gh 的所有请求均已认证。
      # PR body 由 tools/pr_body.py 基于 master...flakebot 实际差异生成；
      # 已存在打开的 flakebot -> master PR 时不再跳过，而是用 gh pr edit
      # 同步刷新 title/body，保证 body 每次运行都反映最新更新内容。
      # 同一脚本额外产出一行变更摘要（PR_RUN_NAME_FILE），供下面 dispatch 给
      # build.yml，让它的 run-name 显示本次实际更新的内容。
      - name: Generate PR body
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          PR_RUN_NAME_FILE: ${{ runner.temp }}/pr-run-name.txt
          PR_TITLE_FALLBACK: ${{ needs.pre-work.outputs.prTitle }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_LOCK: ${{ needs.pre-work.outputs.runLock }}
          RUN_NVFETCHER: ${{ needs.pre-work.outputs.runNvfetcher }}
          RUN_UPDATEPY: ${{ needs.pre-work.outputs.runUpdatePy }}
        run: python3 tools/pr_body.py
      - name: Create or update pull request
        env:
          # 必须用 PAT（可信身份）创建/编辑 PR：GITHUB_TOKEN（github-actions[bot]）
          # 创建的 PR 自 2026-06 起触发 pull_request 工作流需人工审批，无人审批即
          # 过期报错；PAT 创建的 PR 作者为有写权限的用户，免审批直接执行。
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_TITLE: ${{ needs.pre-work.outputs.prTitle }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          # body 生成步骤意外失败时兜底，避免空 body
          [ -s "$PR_BODY_FILE" ] || printf 'This is an automated pull request to update src and lock.\n' > "$PR_BODY_FILE"
          pr_num=$(gh pr list --repo "$GITHUB_REPOSITORY" --head flakebot --base master --state open --limit 100 --json number --jq '.[0].number // empty')
          if [ -n "$pr_num" ]; then
            echo "Pull request from flakebot to master is already open (#$pr_num), syncing title/body."
            gh pr edit "$pr_num" --repo "$GITHUB_REPOSITORY" --title "$PR_TITLE" --body-file "$PR_BODY_FILE"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head flakebot \
              --title "$PR_TITLE" \
              --body-file "$PR_BODY_FILE" \
              --no-maintainer-edit # 原 --maintainer-can-modify=false 并非 gh CLI 的有效 flag
          fi
      # build.yml 的 run-name 取自 client_payload.run_name（见 build.yml 顶部）；
      # 不传时 repository_dispatch 触发的运行名会固定显示为 event_type，
      # 也就是永远看到 "trigger-second-workflow"。
      # 用 gh api 而非 curl：token/header 由 gh 处理，嵌套 client_payload 用
      # `-f key[subkey]=value` 语法（非字符串值用 -F），省掉手拼 JSON 和 jq 依赖；
      # 非 2xx 时 gh 直接以非零码退出并打印 API 错误正文，失败不会再被吞掉。
      # 不用 `gh workflow run`（即 workflow_dispatch）的原因：它会改变 build.yml
      # 的事件类型（client_payload 不存在，run-name 需换写成 inputs），且需要给本
      # workflow 补 actions: write 权限；保持 repository_dispatch 只需 contents: write。
      # token 用 GITHUB_TOKEN 即可：repository_dispatch 是 GITHUB_TOKEN 触发其它
      # 工作流的官方豁免事件（需要 PAT 避开审批门禁的只有 PR/推送类事件）。
      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ needs.pre-work.outputs.prTitle }}
          PR_RUN_NAME_FILE: ${{ runner.temp }}/pr-run-name.txt
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_name=""
          if [ -s "$PR_RUN_NAME_FILE" ]; then
            run_name="$(head -n 1 "$PR_RUN_NAME_FILE")"
          fi
          if [ -z "$run_name" ]; then
            run_name="$PR_TITLE"
          fi
          if [ -z "$run_name" ]; then
            run_name="Update src and lock (${EVENT_NAME})"
          fi

          gh api --method POST --silent \
            "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=trigger-second-workflow \
            -f "client_payload[run_name]=${run_name}"

          echo "已触发 build.yml（run name: ${run_name}）"
