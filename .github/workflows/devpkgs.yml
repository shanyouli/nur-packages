name: "Dev build dev packages"

# 显式声明写权限。仓库的默认 workflow 权限若被收紧为只读，GITHUB_TOKEN 推送会直接 403。
permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:
jobs:
  pre-work:
    runs-on: ubuntu-latest
    # flakebot -> master 的自动更新 PR 由 update.yml 创建，其构建与缓存填充由 build.yml 负责。
    # 这里跳过，避免同一份改动再触发一遍 devpkgs（单平台最长 240 分钟，双平台）。
    # 2026-06 起 GitHub 允许 bot 创建的 PR 触发 pull_request 工作流（需人工审批，
    # 未审批即过期报错 "required approval but was not approved"）；update.yml 已改用
    # PAT（AUTOMERGE_TOKEN）创建 PR，本工作流免审批正常执行并在此处跳过。
    # 用 head 分支而非 github.actor 判断；同时校验 head 仓库，避免同名 fork 分支被误判。
    if: >-
      github.event_name != 'pull_request' ||
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'flakebot')
    outputs:
      updatepy: ${{ steps.check.outputs.python }}
      updateNvfetcher: ${{ steps.check.outputs.nvfetcher }}
      devTest: ${{ steps.check.outputs.dev }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - uses: hustcer/setup-nu@v3
        with:
          version: "v0.108.0"
      - name: check update
        id: check
        shell: nu {0}
        run: |
          let P = open "./tests/dev.yaml"
          let dev = ($P | get -o dev | default false)
          let upPy = ($P | get -o upPy | default false)
          let upNvfetcher = ($P | get -o upNvfetcher | default false)
          ^echo $"dev=($dev)" o>> $env.GITHUB_OUTPUT
          ^echo $"python=($upPy)" o>> $env.GITHUB_OUTPUT
          ^echo $"nvfetcher=($upNvfetcher)" o>> $env.GITHUB_OUTPUT

  update:
    runs-on: ubuntu-latest
    needs: pre-work
    outputs:
      update: ${{ steps.prev_git.outputs.update }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      # GitHub 偶发在 push 时返回 5xx（remote: Internal Server Error，带 Request ID），
      # 属服务端瞬时故障。ad-m/github-push-action 内部只执行一次裸 git push，
      # 不会重试，单次 5xx 就会让整个 job 失败；故改用带指数退避重试的脚本。
      - name: Prepare push helper
        run: |
          cat > "$RUNNER_TEMP/push-retry.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          # 强制推送 HEAD 到指定分支，失败时按指数退避重试。
          # 用法: push-retry.sh <目标分支>
          set -euo pipefail

          if [[ $# -lt 1 ]]; then
            echo "用法: push-retry.sh <目标分支>" >&2
            exit 1
          fi

          dest="$1"
          max_attempts="${PUSH_MAX_ATTEMPTS:-5}"

          : "${GITHUB_TOKEN:?需要 GITHUB_TOKEN 环境变量}"
          : "${GITHUB_REPOSITORY:?需要 GITHUB_REPOSITORY 环境变量}"

          # 显式携带 token，不依赖 actions/checkout 的 persist-credentials
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for (( attempt = 1; attempt <= max_attempts; attempt++ )); do
            echo "第 ${attempt}/${max_attempts} 次尝试推送 HEAD -> ${dest} ..."
            if git push --force "$url" "HEAD:refs/heads/${dest}"; then
              echo "推送成功: ${dest}"
              exit 0
            fi
            if (( attempt < max_attempts )); then
              delay=$(( attempt * 10 ))
              echo "推送失败，${delay} 秒后重试 ..."
              sleep "$delay"
            fi
          done

          echo "连续 ${max_attempts} 次推送 ${dest} 均失败，放弃。" >&2
          exit 1
          SCRIPT
          chmod +x "$RUNNER_TEMP/push-retry.sh"
      - uses: cachix/install-nix-action@v31
        with:
          # FIXME: https://github.com/NixOS/nix/issues/9889
          extra_nix_config: |
            experimental-features = nix-command flakes configurable-impure-env auto-allocate-uids
      - name: Prepare github bot
        id: prev_git
        run: |
          git config --local user.email "flakebot@users.noreply.github.com"
          git config --local user.name "flakebot"
          git checkout -B test-dev
          if [[ '${{ needs.pre-work.outputs.updatepy }}' == 'true' || '${{ needs.pre-work.outputs.updateNvfetcher }}' == 'true' ]]; then
            echo "update=true" >> $GITHUB_OUTPUT
            echo "update=true" >> $GITHUB_ENV
          fi
      - name: update src by update.py
        if: needs.pre-work.outputs.updatepy == 'true'
        run: nix run .#updatePy
      - name: update src by nvfetcher
        if: needs.pre-work.outputs.updateNvfetcher == 'true'
        run: |
          cat > secrets.toml <<EOF
          [keys]
          github = "${{ secrets.GITHUB_TOKEN }}"
          EOF
          nix run .#nvfetcher
          rm -f secrets.toml
      - name: Push changes
        if: ${{ env.update == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RUNNER_TEMP/push-retry.sh" test-dev

  dev-pacakges:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    needs:
      - pre-work
      - update
    outputs:
      MY_MODIFY: ${{ steps.modify_code.outputs.MY_MODIFY }}
    if: ${{ needs.update.outputs.update == 'true' || needs.pre-work.outputs.devTest == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: pre work
        run: |
          git config --local user.email "flakebot@users.noreply.github.com"
          git config --local user.name "flakebot"
          if [[ '${{ needs.update.outputs.update }}' == "true" ]]; then
            git fetch
            git checkout test-dev
          else
            git checkout -B test-dev
          fi
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Setup cachix
        uses: cachix/cachix-action@v17
        # Don't replace <YOUR_CACHIX_NAME> here!
        with:
          name: 'shanyouli'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Check evaluation
        run: nix flake show
      - name: dev nix packages
        if: ${{ needs.pre-work.outputs.devTest == 'true' }}
        run: nix run .#devci
        timeout-minutes: 240
      - name: build all packages
        if: ${{ needs.pre-work.outputs.devTest != 'true' }}
        run: nix run .#ci
        timeout-minutes: 240
      - name: modify code
        id: modify_code
        run: |
          if git status | grep "modified" ; then
            echo "MY_MODIFY=true" >> $GITHUB_ENV
            echo "MY_MODIFY=true" >> $GITHUB_OUTPUT
            git fetch origin
            if git ls-remote origin refs/heads/temp-testdev-${{ matrix.os }} | grep temp-testdev ; then
              git push origin --delete temp-testdev-${{ matrix.os }}
            fi
          fi
      - name: Commit back to repository
        if: ${{ env.MY_MODIFY  == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'auto: update package hashes ${{ matrix.os }}'
          create_branch: true
          branch: temp-testdev-${{ matrix.os }}

  publish-dev:
    runs-on: ubuntu-latest
    needs:
      - pre-work
      - dev-pacakges
      - update
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      # GitHub 偶发在 push 时返回 5xx（remote: Internal Server Error，带 Request ID），
      # 属服务端瞬时故障。ad-m/github-push-action 内部只执行一次裸 git push，
      # 不会重试，单次 5xx 就会让整个 job 失败；故改用带指数退避重试的脚本。
      - name: Prepare push helper
        run: |
          cat > "$RUNNER_TEMP/push-retry.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          # 强制推送 HEAD 到指定分支，失败时按指数退避重试。
          # 用法: push-retry.sh <目标分支>
          set -euo pipefail

          if [[ $# -lt 1 ]]; then
            echo "用法: push-retry.sh <目标分支>" >&2
            exit 1
          fi

          dest="$1"
          max_attempts="${PUSH_MAX_ATTEMPTS:-5}"

          : "${GITHUB_TOKEN:?需要 GITHUB_TOKEN 环境变量}"
          : "${GITHUB_REPOSITORY:?需要 GITHUB_REPOSITORY 环境变量}"

          # 显式携带 token，不依赖 actions/checkout 的 persist-credentials
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for (( attempt = 1; attempt <= max_attempts; attempt++ )); do
            echo "第 ${attempt}/${max_attempts} 次尝试推送 HEAD -> ${dest} ..."
            if git push --force "$url" "HEAD:refs/heads/${dest}"; then
              echo "推送成功: ${dest}"
              exit 0
            fi
            if (( attempt < max_attempts )); then
              delay=$(( attempt * 10 ))
              echo "推送失败，${delay} 秒后重试 ..."
              sleep "$delay"
            fi
          done

          echo "连续 ${max_attempts} 次推送 ${dest} 均失败，放弃。" >&2
          exit 1
          SCRIPT
          chmod +x "$RUNNER_TEMP/push-retry.sh"
      - name: pre work
        run: |
          git config --local user.email "flakebot@users.noreply.github.com"
          git config --local user.name "flakebot"
          if [[  '${{ needs.update.outputs.update }}' == "true" ]]; then
            git fetch origin
            git checkout test-dev
          else
            git checkout -B test-dev
          fi
      - name: Merge os chanages
        if: needs.dev-pacakges.outputs.MY_MODIFY == 'true'
        run: |
          git fetch origin
          echo "Getting information about all branches."
          echo "Merging of branch temp-testdev-macos-latest"
          if git ls-remote origin refs/heads/temp-testdev-macos-latest | grep temp-testdev-macos-latest ; then
            if git diff origin/temp-testdev-macos-latest | grep "+++"; then
              git checkout origin/temp-testdev-macos-latest
              echo "MY_MERGE_MACOS=true" >> $GITHUB_ENV
            fi
          fi
      - uses: hustcer/setup-nu@v3
        with:
          version: "v0.108.0"
      - name: turn off dev.yaml
        if: ${{ needs.pre-work.outputs.devTest == 'true' ||  needs.update.outputs.update == 'true' }}
        shell: nu {0}
        run: |
          let info = {
            dev: false,
            upPy: false,
            upNvfetcher: false,
            apps: ["darwin file -> darwin-apps-xx", "python file -> python-apps-xx", "firefox-addons -> firefox-addons-xx", "fish file -> fish-xx", "emacsPackages -> emacs-packages-xx",  "lua file -> lua-apps-x"]
          }
          $info | to yaml | save -f ./tests/dev.yaml
      - name: commit dev.yaml
        if: ${{ needs.pre-work.outputs.devTest == 'true' || needs.update.outputs.update == 'true' }}
        run: |
          git add ./tests/dev.yaml
          git diff --cached --quiet || git commit -m "feat: turn off dev"
      - name: merge-to-master with macos-latest
        if: ${{ env.MY_MERGE_MACOS == 'true'}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RUNNER_TEMP/push-retry.sh" test-dev
      - name: merge ubuntu chanages
        if: needs.dev-pacakges.outputs.MY_MODIFY == 'true'
        run: |
          git fetch origin
          git checkout test-dev
          git pull
          echo "Merging of branch temp-testdev-ubuntu-latest"
          if git ls-remote origin refs/heads/temp-testdev-ubuntu-latest | grep temp-testdev-ubuntu-latest ; then
            if git diff origin/temp-testdev-ubuntu-latest | grep "+++"; then
              git checkout origin/temp-testdev-ubuntu-latest
              echo "MY_MERGE_LINUX=true" >> $GITHUB_ENV
            fi
          fi
      - name: merge-to-master with ubuntu-latest
        if: ${{ env.MY_MERGE_LINUX == 'true'}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RUNNER_TEMP/push-retry.sh" test-dev
      - name: prev
        run: |
          git fetch
          git checkout test-dev
      - name: Push dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RUNNER_TEMP/push-retry.sh" dev
      - name: Push master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RUNNER_TEMP/push-retry.sh" master
