name: Update src by nvfetcher
on:
  push:
    branches:
      - master
    paths:
      - 'nvfetcher.toml'
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  pre-work:
    runs-on: ubuntu-latest
    outputs:
      updatepy: ${{ steps.check_updatePy.outputs.changed}}
      updateNvfetcher: ${{ steps.check_nvfetcher.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - name: check nvfetcher.toml has changed
        id: check_nvfetcher
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^_sources/.*$"; then
             echo "changed=true" >> $GITHUB_OUTPUT
          fi
  updateNvfetcher:
    runs-on: ubuntu-latest
    needs: pre-work
    if: needs.pre-work.outputs.updateNvfetcher != 'true'
    steps:
      # - uses: styfle/cancel-workflow-action@0.7.0
      #   with:
      #     access_token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - uses: cachix/install-nix-action@v31
        with:
          # FIXME: https://github.com/NixOS/nix/issues/9889
          extra_nix_config: |
            experimental-features = nix-command flakes configurable-impure-env auto-allocate-uids
      - name: Prepare github bot
        run: |
          git config --local user.email "flakebot@users.noreply.github.com"
          git config --local user.name "flakebot"
          git checkout -B flakebot
      - name: Update nvfetcher src
        run: |
          cat > secrets.toml <<EOF
          [keys]
          github = "${{ secrets.GITHUB_TOKEN }}"
          EOF
          nix run .#nvfetcher
          rm -f secrets.toml
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: 'flakebot'
          force: true
      # vsoch/pull-request-action@1.1.1 sends its "check if PR exists" request
      # without auth headers, hitting the anonymous 60 req/hour API rate limit on
      # shared Actions runner IPs. Replaced with gh CLI: all requests are authenticated.
      # Behavior kept the same: skip if an open flakebot -> master PR exists (PASS_IF_EXISTS),
      # otherwise create one.
      - name: pull-request-action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # reuse the existing token, no extra secret needed
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head flakebot --base master --state open --limit 100 --json number --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "Pull request from flakebot to master is already open (count=$count), skipping."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head flakebot \
              --title 'Update src by nvfetcher' \
              --body 'This is an automated pull request to update src by nvfetcher.' \
              --maintainer-can-modify=false
          fi
      - name: Trigger second workflow
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "trigger-second-workflow"}'
